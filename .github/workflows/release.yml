name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches the manifest version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          MANIFEST=$(python3 -c "import json; print(json.load(open('custom_components/fermax_blue/manifest.json'))['version'])")
          if [ "v$MANIFEST" != "$TAG_NAME" ]; then
            echo "::error::Tag $TAG_NAME does not match the manifest version $MANIFEST"
            exit 1
          fi

      - name: Determine pre-release
        id: prerelease
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if echo "$TAG_NAME" | grep -qE 'alpha|beta|rc|preview'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog for this version
        id: changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          # Beta tags (v0.26.1-beta.2) map to the base section `## [0.26.1]`,
          # which carries the `- unreleased` heading while the beta series is
          # in flight and gets its date when the stable is tagged.
          BASE_VERSION="${VERSION%%-*}"
          NOTES=$(awk "/^## \[${BASE_VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG_NAME}"
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          body: ${{ steps.changelog.outputs.notes }}
