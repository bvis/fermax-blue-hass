name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dependency drift check. Dockerfile.dev installs its dependencies unpinned,
  # so a scheduled rebuild resolves fresh versions and surfaces breakage that
  # commit-triggered runs cannot see: a dependency dropping support for a Python
  # version in the matrix, a transitive conflict, or a manifest.json requirement
  # going stale. Without this, such drift only appears on the next unrelated PR.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build dev image (Python ${{ matrix.python-version }})
        run: docker build -t fermax-blue-dev --build-arg PYTHON_VERSION=${{ matrix.python-version }} -f Dockerfile.dev .

      - name: Run tests
        run: docker run --rm -v $PWD:/app -w /app fermax-blue-dev pytest tests/ -v --cov=custom_components/fermax_blue --cov-report=term-missing --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build dev image
        run: docker build -t fermax-blue-dev -f Dockerfile.dev .

      - name: Lint
        run: docker run --rm -v $PWD:/app -w /app fermax-blue-dev ruff check custom_components/ tests/ scripts/

      - name: Format check
        run: docker run --rm -v $PWD:/app -w /app fermax-blue-dev ruff format --check custom_components/ tests/ scripts/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build dev image
        run: docker build -t fermax-blue-dev -f Dockerfile.dev .

      - name: Type check
        run: docker run --rm -v $PWD:/app -w /app fermax-blue-dev mypy custom_components/fermax_blue/ --ignore-missing-imports

  dead-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build dev image
        run: docker build -t fermax-blue-dev -f Dockerfile.dev .
      - name: Dead code check
        run: docker run --rm -v $PWD:/app -w /app fermax-blue-dev vulture custom_components/fermax_blue/ .vulture_whitelist.py --min-confidence 80

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master @ 2026-09-10

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main @ 2026-06-09
        with:
          category: integration
