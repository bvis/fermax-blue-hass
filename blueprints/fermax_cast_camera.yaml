blueprint:
  name: "Fermax: Send the camera to a screen"
  description: >
    Shows the intercom camera on the Cast screens carrying a label (a Nest Hub,
    a Chromecast, a TV with Chromecast built-in). With a dropdown helper, only
    the screen whose name is selected gets it; any other option sends it to all
    of them. Wakes the intercom first when no call is live, so the screen shows
    the last picture with the wake-up bar and then the live video. Call it
    from a dashboard button.
  domain: script
  input:
    camera_entity:
      name: Camera entity
      selector:
        entity:
          filter:
            domain: camera
            integration: fermax_blue
    display_label:
      name: Screens label
      description: The media players with this label are the screens you can send to
      selector:
        label:
    choice_helper:
      name: Screen dropdown (optional)
      description: >
        A dropdown helper whose selected option is a screen's name, or anything
        else (e.g. "All") for every screen. The "Fermax: Keep the screen
        dropdown up to date" blueprint fills its options from the label.
      default: ""
      selector:
        entity:
          filter:
            domain: input_select

mode: restart
variables:
  camera_entity: !input camera_entity
  display_label: !input display_label
  choice_helper: !input choice_helper
  labelled: "{{ label_entities(display_label) | select('match', 'media_player\\.') | select('has_value') | list }}"
  picked: >
    {% set choice = states(choice_helper) if choice_helper else '' %}
    {{ labelled | select('is_state_attr', 'friendly_name', choice) | list }}
  displays: "{{ picked if picked else labelled }}"

sequence:
  - condition: template
    value_template: "{{ displays | count > 0 }}"
  # Wake first: casting to several screens takes seconds, and the screen shows
  # the wake-up bar meanwhile anyway
  - if:
      - condition: template
        value_template: "{{ not is_state(camera_entity, 'streaming') }}"
    then:
      - action: camera.turn_on
        target:
          entity_id: "{{ camera_entity }}"
        continue_on_error: true
  - action: media_player.play_media
    target:
      entity_id: "{{ displays }}"
    data:
      # The MJPEG endpoint, not media-source://camera/...: the camera advertises a
      # WebRTC stream source, which the HLS path cannot open. Cast signs this
      # relative path automatically.
      media_content_id: "/api/camera_proxy_stream/{{ camera_entity }}"
      media_content_type: "image/jpg"
