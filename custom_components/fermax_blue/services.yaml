send_audio:
  fields:
    entity_id:
      required: false
      selector:
        entity:
          filter:
            domain: camera
            integration: fermax_blue
    audio_file:
      required: false
      example: "/config/media/doorbell_response.wav"
      selector:
        text:
    message:
      required: false
      example: "Hola, ahora bajo"
      selector:
        text:
    language:
      required: false
      default: "es"
      selector:
        text:
