[project]
name = "fermax-blue-hass"
# The version lives in custom_components/fermax_blue/manifest.json only.
dynamic = ["version"]
description = "Home Assistant integration for Fermax Blue intercoms"
requires-python = ">=3.13"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:josepy",
    "ignore::DeprecationWarning:acme",
    "ignore::DeprecationWarning:homeassistant",
]

[tool.mypy]
# No python_version: each check uses the interpreter of its image, so the
# Python 3.13 and 3.14 runs see the Home Assistant that Python gets.
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.vulture]
min_confidence = 80
paths = ["custom_components/fermax_blue"]

[tool.coverage.run]
source = ["custom_components/fermax_blue"]

[tool.coverage.report]
# Keep a small margin below actual coverage (97%) so honest changes don't
# flap CI; new code is still expected to ship with tests.
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
